<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Support the ohgeeceee network</title>
<meta name="description" content="These sites are free, open, and ad-free. Drop a tip in the jar to help keep them running." />
<meta name="theme-color" content="#FAF7F2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#14110E; --paper:#FAF7F2; --muted:#6B645C;
    --line:rgba(20,17,14,.11); --card:#FFFFFF;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --serif:'Fraunces',Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
       min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;width:100%}

  header{padding:26px 0}
  .brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none}
  .brand svg{width:24px;height:24px}
  .brand b{font-weight:600;font-size:16px}
  .brand span{color:var(--muted);font-size:16px}
  .back{float:right;color:var(--muted);text-decoration:none;font-size:14px;margin-top:3px}
  .back:hover{color:var(--ink)}

  main{flex:1;padding:26px 0 40px}
  #support{max-width:640px;margin:0 auto;text-align:center}

  .sup-setup{background:#FBF0DC;border:1px solid #E7C98A;border-radius:12px;
    padding:14px 16px;font-size:13.5px;line-height:1.5;text-align:left;
    color:#6a4e14;margin-bottom:30px}
  .sup-setup code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px;font-size:12.5px}

  .sup-h{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;
    font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:8px 0 16px}
  .sup-blurb{color:#463F38;font-size:1.05rem;max-width:520px;margin:0 auto 36px}

  .sup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
  .sup-tier{position:relative;display:flex;flex-direction:column;align-items:center;
    gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px 14px 20px;text-decoration:none;color:var(--ink);
    transition:transform .16s,box-shadow .16s,border-color .16s}
  .sup-tier:hover{transform:translateY(-3px);box-shadow:0 16px 34px -20px rgba(20,17,14,.4);
    border-color:rgba(20,17,14,.24)}
  .sup-tier.feat{border-color:var(--ink)}
  .sup-flag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);font-size:10.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .sup-amt{font-family:var(--serif);font-size:2.1rem;font-weight:500;line-height:1}
  .sup-lbl{font-weight:600;font-size:.95rem}
  .sup-note{color:var(--muted);font-size:.8rem;line-height:1.35}
  .sup-tier.ph{opacity:.55;cursor:not-allowed}

  .sup-alt{display:flex;flex-direction:column;gap:8px;align-items:center;margin:6px 0 30px}
  .sup-custom{font-weight:600;text-decoration:none;border-bottom:1px solid var(--ink);
    padding-bottom:1px}
  .sup-custom:hover{opacity:.65}
  .sup-custom.ph{opacity:.5;border-color:var(--muted)}

  .sup-fine{color:var(--muted);font-size:.82rem;display:flex;align-items:center;
    justify-content:center;gap:7px;margin-top:6px}
  .sup-fine::before{content:"";width:14px;height:14px;border-radius:3px;
    background:#635BFF;display:inline-block} /* Stripe blurple dot */

  footer{border-top:1px solid var(--line);padding:24px 0 50px;color:var(--muted);font-size:13.5px;text-align:center}

  @media(max-width:520px){.sup-grid{grid-template-columns:1fr;gap:12px}
    .sup-tier{flex-direction:row;justify-content:center;gap:12px;padding:18px}
    .sup-flag{left:18px;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="5" r="2.4" fill="#14110E"/><circle cx="5" cy="17" r="2.4" fill="#14110E"/>
        <circle cx="19" cy="17" r="2.4" fill="#14110E"/>
        <path d="M12 6.6 5.6 15.4M12 6.6l6.4 8.8M6.6 17.6h10.8" stroke="#14110E" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <b>ohgeeceee</b><span>network</span>
    </a>
    <a class="back" href="/">&larr; Back to the network</a>
  </header>

  <main>
    <div id="support"><!-- injected from ogc-network.js --></div>
  </main>
</div>

<footer>No trackers on this page. Payments handled entirely by Stripe.</footer>

<script src="ogc-network.js" data-ogc-bar="off"></script>
<script>
  (function boot(){
    if(!window.OGCNetwork){return setTimeout(boot,40);}
    window.OGCNetwork.renderSupport("#support");
  })();
</script>
</body>
</html>
