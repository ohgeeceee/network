<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank you — Remote Tech Support</title>
<style>
  :root{ --bg:#0b1020; --bg2:#111a33; --txt:#e8edff; --accent:#5b8cff; --accent2:#22d3ee; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);background:radial-gradient(900px 500px at 50% -10%,rgba(91,140,255,.2),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));text-align:center;padding:24px}
  .box{max-width:480px}
  .check{width:84px;height:84px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 50px rgba(91,140,255,.45)}
  .check svg{width:42px;height:42px;stroke:#04122e;stroke-width:3;fill:none}
  h1{font-size:2rem;margin:0 0 10px}
  p{color:#9fb0d6;font-size:1.05rem;margin:0 0 26px}
  a.btn{display:inline-block;padding:13px 26px;border-radius:999px;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#04122e;font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h1>You're booked in!</h1>
    <p>Thanks for your request. You'll get a confirmation email shortly with next steps. I'll be in touch to confirm your session.</p>
    <a class="btn" href="index.html">← Back to home</a>
  </div>
</body>
</html>
